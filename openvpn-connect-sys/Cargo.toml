[package]
name = "openvpn-connect-sys"
description = "Raw source-built bindings to the OpenVPN 3 Core client API"
documentation = "https://docs.rs/openvpn-connect-sys"
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
links = "openvpn3-core"
build = "build.rs"
include = [
    "build.rs",
    "build/**",
    "CMakeLists.txt",
    "PATCHES.md",
    "patches/**",
    "src/**",
    "tests/**",
    "vendor/asio/asio/include/**",
    "vendor/asio/asio/LICENSE_1_0.txt",
    "vendor/openvpn3/client/**",
    "vendor/openvpn3/openvpn/**",
    "vendor/openvpn3/LICENSE.md",
    "vendor/openvpn3/LICENSES/**",
    "vendor/openvpn3/README.md",
]

[features]
default = []
vendor = ["dep:lz4-sys"]
dco = []
external-transport = []
external-tun = []

[dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
blowfish = "0.9.1"
cbc = { version = "0.1.2", features = ["alloc"] }
chacha20poly1305 = "0.10.1"
ctr = "0.9.2"
des = "0.8.1"
digest = "0.10.7"
getrandom = "0.3.4"
hickory-resolver = "0.26.1"
hmac = "0.12.1"
lz4-sys = { version = "1.11.1", optional = true }
md-5 = "0.10.6"
md4 = "0.10.2"
pkcs8 = { version = "0.10.2", features = ["encryption", "pem", "std"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-webpki = { version = "0.103.13", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
x509-parser = "0.18.1"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1.54"

[dev-dependencies]
cmake = "0.1.54"

[lints]
workspace = true
